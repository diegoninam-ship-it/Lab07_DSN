<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Lab07{% endblock %}</title>
<style>
  :root{ --bg:#0E1420; --elev:#141B29; --line:#232C3D; --text:#E7ECF3; --dim:#8B96A8; --accent:#5EEAD4; --danger:#F5716C; }
  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',Arial,sans-serif; margin:0; min-height:100vh; display:flex; flex-direction:column; }
  header.barra{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); }
  main{ flex:1; width:100%; max-width:860px; margin:0 auto; padding:32px 20px; }
  footer{ padding:14px 24px; border-top:1px solid var(--line); color:var(--dim); font-size:.85rem; text-align:center; }
  footer strong{ color:var(--accent); }
  form.inline{ display:flex; align-items:center; gap:12px; margin:0; }
  label{ display:block; font-size:.8rem; color:var(--dim); margin-bottom:6px; }
  input[type=text], input[type=password], input[type=number]{ width:100%; padding:10px 12px; margin-bottom:16px; background:var(--elev); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:.9rem; }
  .btn, .btn-sec{ padding:9px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:.85rem; }
  .btn{ background:var(--accent); color:#0E1420; }
  .btn-sec{ background:var(--elev); color:var(--text); border:1px solid var(--line); }
  .msg{ padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:.85rem; }
  .msg.error{ background:rgba(245,113,108,.1); border:1px solid var(--danger); color:var(--danger); }
  .msg.ok{ background:rgba(94,234,212,.1); border:1px solid var(--accent); color:var(--accent); }
  .campo-error{ color:var(--danger); font-size:.8rem; margin:-10px 0 12px; }
</style>
</head>
<body>
<header class="barra">
  <strong>Lab07 · Productos</strong>
  {% if g.usuario %}
  <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span>{{ g.usuario.nombre }}</span>
    <button class="btn-sec" type="submit">Salir</button>
  </form>
  {% endif %}
</header>
<main>
  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}<div class="msg {{ categoria }}">{{ mensaje }}</div>{% endfor %}
  {% endwith %}
  {% block contenido %}{% endblock %}
</main>
<footer>Atendido por: <strong>{{ server_id }}</strong></footer>
</body>
</html>
