<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Lab07{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<header class="barra">
  <strong>Lab07 · Productos</strong>
  {% if g.usuario %}
  <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span>{{ g.usuario.nombre }}</span>
    <button class="btn-sec" type="submit">Salir</button>
  </form>
  {% endif %}
</header>
<main>
  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}<div class="msg {{ categoria }}">{{ mensaje }}</div>{% endfor %}
  {% endwith %}
  {% block contenido %}{% endblock %}
</main>
<footer>Atendido por: <strong>{{ server_id }}</strong></footer>
</body>
</html>
